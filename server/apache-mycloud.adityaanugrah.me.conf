<VirtualHost *:80>
    ServerName mycloud.adityaanugrah.me
    DocumentRoot /var/www/mycloud.adityaanugrah.me/frontend/dist

    <Directory /var/www/mycloud.adityaanugrah.me/frontend/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:4000/ connectiontimeout=5 timeout=900
    ProxyPassReverse /api/ http://127.0.0.1:4000/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ErrorLog ${APACHE_LOG_DIR}/mycloud.adityaanugrah.me-error.log
    CustomLog ${APACHE_LOG_DIR}/mycloud.adityaanugrah.me-access.log combined
</VirtualHost>
