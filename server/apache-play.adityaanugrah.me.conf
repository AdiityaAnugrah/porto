<VirtualHost *:80>
    ServerName play.adityaanugrah.me
    DocumentRoot /var/www/adityaanugrah.me/play

    <Directory /var/www/adityaanugrah.me/play>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/play.adityaanugrah.me-error.log
    CustomLog ${APACHE_LOG_DIR}/play.adityaanugrah.me-access.log combined
</VirtualHost>
