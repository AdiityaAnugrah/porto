<VirtualHost *:80>
    ServerName api.adityaanugrah.me

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    ErrorLog ${APACHE_LOG_DIR}/api.adityaanugrah.me-error.log
    CustomLog ${APACHE_LOG_DIR}/api.adityaanugrah.me-access.log combined
</VirtualHost>
